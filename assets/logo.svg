<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <marker id="ah" markerWidth="14" markerHeight="14" refX="7" refY="6" orient="auto">
      <path d="M1 1 L12 6 L1 11 Z" fill="#FDE68A"/>
    </marker>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- continuity / repurpose loop -->
  <path d="M 256 132 A 124 124 0 1 1 132 256"
        fill="none" stroke="#FDE68A" stroke-width="13"
        stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- mind-map connectors -->
  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="256" x2="156" y2="172"/>
    <line x1="256" y1="256" x2="356" y2="172"/>
    <line x1="256" y1="256" x2="168" y2="346"/>
    <line x1="256" y1="256" x2="348" y2="346"/>
  </g>

  <!-- mind-map nodes (center = persistent Mind, others = platforms) -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="256" r="36"/>
    <circle cx="156" cy="172" r="19"/>
    <circle cx="356" cy="172" r="19"/>
    <circle cx="168" cy="346" r="19"/>
    <circle cx="348" cy="346" r="19"/>
  </g>
  <circle cx="256" cy="256" r="15" fill="#4F46E5"/>
</svg>
